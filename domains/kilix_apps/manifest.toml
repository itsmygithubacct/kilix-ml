# How kilix-needle fine-tunes Needle 2 for its `apps` job from this library.
# Read by `kilix-needle tune --job apps`; every input is pinned and every
# output is gated. Source, base and environment are the kilix_panes pack's.
schema = "kilix-needle-tuning/v1"

[source]
url = "https://github.com/cactus-compute/needle.git"
tag = "v2.0.9"
commit = "571fcd68f48b6649c91f353eb91d0a0c9b9135ce"
licence = "Apache-2.0"

[base]
checkpoint_asset = "needle2-train"
runtime_asset = "needle2-runtime"
checkpoint_sha256 = "4b0a972d163ffc7678fb3c36bace508114872e9d2ce9e10f225825752d3795bc"
tokenizer_model_sha256 = "0871b8e3df78e0dd7ccc236e187fc055f75cd57ebe3bec76ca8103030b8fe659"
tokenizer_vocab_sha256 = "ed835aff5b2a3ca67b5896906dd471ab0ce12626d699d90e736e3c7e4ba9b1e3"

[environment]
python = "3.13"
requirements = "requirements-train.lock"   # byte-identical to kilix_panes'; hash-locked
offline = true

[data]
toolset = "apps"       # the job's five tools (tools.json)
seed = 0
per_template = 6
# kilix-needle excludes every evals/**/*.jsonl request as well.
exclude = ["evals/apps/dev.jsonl", "evals/apps/test.jsonl", "evals/apps/heldout-v1.jsonl"]

[train]
epochs = 4
batch_size = 16
learning_rate = 2e-4
lora_rank = 16
lora_alpha = 32.0
max_len = 1024
val_split = 0.1

[gates]
unsafe_max = 0                          # on every eval set
reference = "base-apps"                 # the untuned model with this job's tools
# Written blind by a fresh agent from the job's spec, before this corpus.
heldout = "evals/apps/heldout-v1.jsonl"
min_heldout_exact_gain = 5              # percentage points over the reference
no_tag_regression_above = 2
